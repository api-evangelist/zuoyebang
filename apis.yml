description: Zuoyebang (作业帮) is a Chinese educational technology company founded in 2015 and headquartered
  in Beijing, backed by SoftBank Vision Fund. It operates a "technology + education" online learning platform
  whose flagship homework-help app lets K-12 students photograph a problem to get step-by-step answers,
  on-demand tutoring, and self-study tools across all subjects, alongside math tutoring products aimed
  at elementary-school parents and teachers. It is a consumer mobile/web product with no public developer
  program, open platform, or documented API surface at the time of this enrichment pass.
